name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The version code of the app is the number of commits.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Use a private signing key when one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSCUAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muscuapp-release.jks"
            echo "MUSCUAPP_KEYSTORE_FILE=$RUNNER_TEMP/muscuapp-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest --tests 'com.lehyanflouriot.muscuapp.core.*'

      - name: Screenshots of the screens
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest --tests 'com.lehyanflouriot.muscuapp.ui.*'

      - name: Build the release APK
        env:
          MUSCUAPP_KEYSTORE_PASSWORD: ${{ secrets.MUSCUAPP_KEYSTORE_PASSWORD }}
          MUSCUAPP_KEY_ALIAS: ${{ secrets.MUSCUAPP_KEY_ALIAS }}
          MUSCUAPP_KEY_PASSWORD: ${{ secrets.MUSCUAPP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Collect the APK and the screenshots
        if: always()
        run: |
          mkdir -p dist/screenshots
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/MuscuApp.apk
          fi
          cp app/build/outputs/roborazzi/*.png dist/screenshots/ 2>/dev/null || true
          ls -R dist

      - name: Upload the build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muscuapp
          path: |
            dist/
            app/build/reports/
          if-no-files-found: warn

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          short_sha=$(git rev-parse --short HEAD)
          cat > notes.md <<NOTES
          ## Installer MuscuApp sur ton téléphone

          1. Sur ton téléphone Android, télécharge **MuscuApp.apk** ci-dessous.
          2. Ouvre le fichier téléchargé. Si Android le demande, autorise l'installation d'applications depuis ton navigateur.
          3. Appuie sur **Installer**, puis ouvre MuscuApp.

          Pour une mise à jour, installe simplement le nouvel APK par-dessus l'ancien : tes données sont conservées.

          Les captures d'écran de l'app sont jointes à cette version.

          _Version ${version}, construite à partir du commit ${short_sha}._
          NOTES
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/MuscuApp.apk $(ls dist/screenshots/*.png 2>/dev/null) \
            --title "MuscuApp $version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
